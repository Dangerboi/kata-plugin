name: Kata compatibility

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: compatibility (tests ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The runner has 4 CPUs and the suite keeps them all busy, so each job runs half the test files.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Isolate homes and configuration
        run: |
          isolated=$(mktemp -d /tmp/kata-compatibility.XXXXXX)
          mkdir -p "$isolated"/{home,kata,config,data,cache,pi,omp}
          {
            echo "COMPATIBILITY_ROOT=$isolated"
            echo "HOME=$isolated/home"
            echo "KATA_HOME=$isolated/kata"
            echo "XDG_CONFIG_HOME=$isolated/config"
            echo "XDG_DATA_HOME=$isolated/data"
            echo "XDG_CACHE_HOME=$isolated/cache"
            echo "PI_CODING_AGENT_DIR=$isolated/pi"
            echo "OMP_CONFIG_DIR=$isolated/omp"
            echo "KATA_TEST_EXECUTABLE=$isolated/bin/kata"
          } >> "$GITHUB_ENV"

      - name: Install Bun and public Kata
        uses: ./.github/actions/setup-kata
        with:
          bin: ${{ env.COMPATIBILITY_ROOT }}/bin

      - name: Install dependencies
        run: bun install --ignore-scripts --frozen-lockfile

      # The tests and the published packages use the committed copies in plugins/*, so nothing regenerates them here.
      - name: Check the vendored copies match core
        run: bun run check:plugins

      - name: Test suite, half ${{ matrix.shard }} of 2
        run: bun run test
        env:
          KATA_TEST_SHARD: ${{ matrix.shard }}/2

      - name: Typecheck
        if: matrix.shard == 2
        run: bun run typecheck
