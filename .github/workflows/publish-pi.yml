# Publishes @dangerboi/kata-pi, @dangerboi/kata-omp and @dangerboi/kata-opencode to npm through trusted publishing (OIDC): no token, no one-time code.
# npm trusts this file by name (publish-pi.yml) for Dangerboi/kata-plugin, for all three packages; renaming it breaks publishing.
# The packages release on separate tags: v<version> runs the pi and omp jobs, opencode-v<version> runs the OpenCode job.
# GitHub's "v*" tag filter does not match "opencode-v*" (it must start with v), so each pattern is listed.
name: Publish npm packages

on:
  push:
    tags: ["v*", "opencode-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (for example v1.7.2 or opencode-v1.0.0)
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-pi
  cancel-in-progress: false

jobs:
  verify:
    # Nothing publishes before the committed copies of core match core and every package packs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          package-manager-cache: false

      - uses: ./.github/actions/setup-kata
        with:
          bin: ${{ runner.temp }}/kata-bin

      - run: bun install --ignore-scripts --frozen-lockfile
      - run: bun run check:plugins
      - run: for dir in pi oh-my-pi opencode; do npm pack --dry-run --prefix plugins/$dir ./plugins/$dir; done

  publish:
    needs: verify
    if: startsWith(inputs.tag || github.ref_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Check the tag matches the pi version
        id: check
        working-directory: plugins/pi
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match $name $version; the pi version must equal the tag."
            exit 1
          fi
          if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
            echo "::notice::$name@$version is already on npm; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.check.outputs.publish == 'true'
        working-directory: plugins/pi
        run: npm publish

  # A root release also publishes the omp package. It keeps its own version, which the tag does not name, so the job
  # skips only a version already on npm, and tags from before the npm package, whose manifest names unpublished kata-omp.
  publish-omp:
    needs: verify
    if: startsWith(inputs.tag || github.ref_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Check the omp version is not on npm
        id: check
        working-directory: plugins/oh-my-pi
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if [ "$name" != "@dangerboi/kata-omp" ]; then
            echo "::notice::This tag's omp package is $name, which is not published to npm; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
            echo "::notice::$name@$version is already on npm; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.check.outputs.publish == 'true'
        working-directory: plugins/oh-my-pi
        run: npm publish

  # The OpenCode package has its own version and its own tag, opencode-v<version>; a pi tag never runs this job.
  publish-opencode:
    needs: verify
    if: startsWith(inputs.tag || github.ref_name, 'opencode-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Check the tag matches the OpenCode version
        id: check
        working-directory: plugins/opencode
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "opencode-v$version" ]; then
            echo "::error::Tag $TAG does not match $name $version; the tag must be opencode-v$version."
            exit 1
          fi
          if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
            echo "::notice::$name@$version is already on npm; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.check.outputs.publish == 'true'
        working-directory: plugins/opencode
        run: npm publish
