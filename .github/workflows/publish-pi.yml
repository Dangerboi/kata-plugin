# Publishes @dangerboi/kata-pi, @dangerboi/kata-omp and @dangerboi/kata-opencode to npm through trusted publishing (OIDC): no token, no one-time code.
# npm trusts this file by name (publish-pi.yml) for Dangerboi/kata-plugin, for all three packages; renaming it breaks publishing.
# Each package releases on its own tag: pi-v<version>, omp-v<version> and opencode-v<version> each run one publish job,
# which fails when the tag does not name the package's version. Claude Code's claude-code-v<version> tags publish nothing.
name: Publish npm packages

on:
  push:
    tags: ["pi-v*", "omp-v*", "opencode-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (for example pi-v1.13.0, omp-v2.13.0 or opencode-v1.3.0)
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-pi
  cancel-in-progress: false

jobs:
  verify:
    # Nothing publishes before the committed copies of core match core and every package packs. It needs only the tag's own
    # files and Node (which runs TypeScript), so a re-run of a tag from before this job works too, and it gets no publish rights.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          package-manager-cache: false

      - run: node scripts/vendor-core.ts --check
      - run: for dir in pi oh-my-pi opencode; do (cd plugins/$dir && npm pack --dry-run); done

  publish-pi:
    needs: verify
    if: startsWith(inputs.tag || github.ref_name, 'pi-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Check the tag matches the pi version
        id: check
        working-directory: plugins/pi
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "pi-v$version" ]; then
            echo "::error::Tag $TAG does not match $name $version; the tag must be pi-v$version."
            exit 1
          fi
          if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
            echo "::notice::$name@$version is already on npm; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.check.outputs.publish == 'true'
        working-directory: plugins/pi
        run: npm publish

  publish-omp:
    needs: verify
    if: startsWith(inputs.tag || github.ref_name, 'omp-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Check the tag matches the omp version
        id: check
        working-directory: plugins/oh-my-pi
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "omp-v$version" ]; then
            echo "::error::Tag $TAG does not match $name $version; the tag must be omp-v$version."
            exit 1
          fi
          if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
            echo "::notice::$name@$version is already on npm; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.check.outputs.publish == 'true'
        working-directory: plugins/oh-my-pi
        run: npm publish

  publish-opencode:
    needs: verify
    if: startsWith(inputs.tag || github.ref_name, 'opencode-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Check the tag matches the OpenCode version
        id: check
        working-directory: plugins/opencode
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "opencode-v$version" ]; then
            echo "::error::Tag $TAG does not match $name $version; the tag must be opencode-v$version."
            exit 1
          fi
          if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
            echo "::notice::$name@$version is already on npm; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.check.outputs.publish == 'true'
        working-directory: plugins/opencode
        run: npm publish
