name: OMP native Pi attention

# The unit tests run in the compatibility workflow; this one drives real omp releases through their bash tool.
on:
  pull_request:
    paths:
      - core/**
      - plugins/**
      - scripts/smoke-omp-attention.ts
      - scripts/smoke-provider.ts
      - package.json
      - .github/workflows/omp-attention.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attention:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        omp: [18.18.1, 18.18.6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install Bun, public Kata 0.23.0 and isolated harnesses
        env:
          OMP_VERSION: ${{ matrix.omp }}
        run: |
          npm install --global bun@1.4.4
          mkdir -p "$RUNNER_TEMP/kata-bin" "$RUNNER_TEMP/harnesses"
          release=https://github.com/kenn-io/kata/releases/download/v0.23.0
          curl -fsSL --retry 3 "$release/kata_0.23.0_linux_amd64.tar.gz" -o "$RUNNER_TEMP/kata-bin/kata_0.23.0_linux_amd64.tar.gz"
          curl -fsSL --retry 3 "$release/SHA256SUMS" -o "$RUNNER_TEMP/kata-bin/SHA256SUMS"
          (
            cd "$RUNNER_TEMP/kata-bin"
            sha256sum --check --ignore-missing SHA256SUMS
          )
          tar -xzf "$RUNNER_TEMP/kata-bin/kata_0.23.0_linux_amd64.tar.gz" -C "$RUNNER_TEMP/kata-bin" kata
          echo "$RUNNER_TEMP/kata-bin" >> "$GITHUB_PATH"
          bun install --ignore-scripts --frozen-lockfile
          npm install --prefix "$RUNNER_TEMP/harnesses" "@oh-my-pi/pi-coding-agent@$OMP_VERSION"
          echo "OMP_BIN=$RUNNER_TEMP/harnesses/node_modules/.bin/omp" >> "$GITHUB_ENV"
          echo "PI_BIN=$GITHUB_WORKSPACE/node_modules/.bin/pi" >> "$GITHUB_ENV"
      - name: Use synthetic configuration
        run: |
          mkdir -p "$RUNNER_TEMP/attention-home"
          echo "HOME=$RUNNER_TEMP/attention-home" >> "$GITHUB_ENV"
          echo "XDG_CONFIG_HOME=$RUNNER_TEMP/attention-home/config" >> "$GITHUB_ENV"
          echo "PI_CODING_AGENT_DIR=$RUNNER_TEMP/attention-home/pi" >> "$GITHUB_ENV"
          echo "KATA_HOME=$RUNNER_TEMP/attention-home/kata" >> "$GITHUB_ENV"
      - name: Actual OMP bash path and native Pi lead control
        run: bun run smoke:omp-attention
