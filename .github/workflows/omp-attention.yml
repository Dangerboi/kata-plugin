name: OMP native Pi attention

# The unit tests run in the compatibility workflow; this one drives real omp releases through their bash tool.
on:
  pull_request:
    paths:
      - core/**
      - plugins/**
      - scripts/**
      - package.json
      - bun.lock
      - .github/actions/**
      - .github/workflows/omp-attention.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omp-attention-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  attention:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        omp: [19.1.1]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install Bun and public Kata
        uses: ./.github/actions/setup-kata
        with:
          bin: ${{ runner.temp }}/kata-bin
      - name: Install dependencies and isolated harnesses
        env:
          OMP_VERSION: ${{ matrix.omp }}
        run: |
          bun install --ignore-scripts --frozen-lockfile
          npm install --ignore-scripts --prefix "$RUNNER_TEMP/harnesses" "@oh-my-pi/pi-coding-agent@$OMP_VERSION"
          echo "OMP_BIN=$RUNNER_TEMP/harnesses/node_modules/.bin/omp" >> "$GITHUB_ENV"
      - name: Use synthetic configuration
        run: |
          mkdir -p "$RUNNER_TEMP/attention-home"
          echo "HOME=$RUNNER_TEMP/attention-home" >> "$GITHUB_ENV"
          echo "XDG_CONFIG_HOME=$RUNNER_TEMP/attention-home/config" >> "$GITHUB_ENV"
          echo "PI_CODING_AGENT_DIR=$RUNNER_TEMP/attention-home/pi" >> "$GITHUB_ENV"
          echo "KATA_HOME=$RUNNER_TEMP/attention-home/kata" >> "$GITHUB_ENV"
      - name: Actual OMP bash path and native Pi lead control
        run: bun run smoke:omp-attention
